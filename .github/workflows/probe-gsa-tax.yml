name: Probe GSA state tax pages
# TEMPORARY — reads GSA SmartTax per-state pages (the sandbox can't reach smartpay.gsa.gov) and prints the lodging-tax wording.
on:
  push:
    branches: [claude/cloud-session-setup-i08vkf]
    paths: [".github/workflows/probe-gsa-tax.yml"]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Read the pages
        run: |
          cat > probe.mjs <<'JS'
          const BASE = "https://smartpay.gsa.gov/smarttax/tax-information-by-state/";
          const text = (html) => html.replace(/<script[\s\S]*?<\/script>|<style[\s\S]*?<\/style>/g, " ").replace(/<[^>]+>/g, " ").replace(/&nbsp;/g, " ").replace(/&amp;/g, "&").replace(/&#39;|&rsquo;/g, "'").replace(/\s+/g, " ").trim();
          const get = async (u) => { const r = await fetch(u, { headers: { "User-Agent": "Mozilla/5.0" } }); return r.ok ? r.text() : `HTTP ${r.status}`; };
          const idx = await get(BASE);
          console.log("INDEX length", idx.length, idx.slice(0, 120));
          const slugs = [...new Set([...idx.matchAll(/tax-information-by-state\/([a-z-]+)/g)].map((m) => m[1]))];
          console.log("SLUGS", slugs.length, slugs.join(","));
          for (const s of slugs) {
            const t = text(await get(BASE + s));
            const sentences = t.split(/(?<=[.!?])\s+/).filter((x) => /lodging|hotel|transient|occupancy|exempt|room/i.test(x));
            console.log(`\n##### ${s} (${t.length} chars)\n` + sentences.slice(0, 14).join("\n").slice(0, 2200));
          }
          JS
          node probe.mjs
