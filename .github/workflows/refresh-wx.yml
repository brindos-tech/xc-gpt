name: Refresh weather

# Twice a day (after the 00Z and 12Z GFS runs are out): 8-day gridded weather
# for the planner's radar / icing / ceiling / flight-category overlays, from
# Open-Meteo (scripts/fetch-wx.js). The output is NOT committed to main —
# 3-hourly forecast files would bloat history — it is force-published as a
# single commit on the `wx-data` branch, which deploy-pages.yml folds into the
# site at deploy time. A finished run triggers a deploy.
# It is started by refresh-wx-schedule.yml (every 3 hours, only when the published forecast is old) or by hand; see there.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-wx
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Cheap one-request check of the response shape; shows up in the log
      # when the API changes.
      - name: Probe Open-Meteo response shape
        run: node scripts/fetch-wx.js --probe

      - name: Build weather grid
        run: node scripts/fetch-wx.js

      # the forecast publish replaces the whole branch, so include fresh TFRs
      # an FAA outage must not cost the forecast: if this fails, the last published tfr.json is carried over below
      - name: Fetch TFRs
        continue-on-error: true
        run: node scripts/fetch-tfr.js

      - name: Publish to wx-data
        run: |
          set -e
          # files with their own workflows (NOTAMs) and the last good TFRs (if the fetch above failed) are carried
          # over so this replace does not drop them
          git fetch --depth=1 origin wx-data || true
          for f in notams.json tfr.json; do
            if [ ! -f "data/generated/wx/$f" ] && git show "FETCH_HEAD:wx/$f" > "/tmp/$f" 2>/dev/null; then cp "/tmp/$f" "data/generated/wx/$f"; echo "kept the previous $f"; fi
          done
          tmp="$(mktemp -d)"
          cp -r data/generated/wx "$tmp/wx"
          git config user.name "xc-gpt-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan wx-data-tmp
          git rm -rf -q .
          cp -r "$tmp/wx" wx
          git add wx
          git commit -q -m "weather data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push --force origin HEAD:wx-data
          du -sh wx
