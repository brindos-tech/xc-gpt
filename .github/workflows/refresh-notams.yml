name: Refresh NOTAMs

# Once a day (plus a retry later the same day): show-stopper NOTAMs (airport/runway closed, fuel unavailable) from the NOTAM Management
# Service API (scripts/fetch-notams.js), for the crew card.
# The service allows ONE bulk pull per 24 hours, so the script reads the last published file and refuses to pull
# again within 23 hours (the retry run below is a no-op unless the morning run failed). Run with force=true only
# if you accept that it counts against the day's one pull.
# Needs the repository secrets FAA_NMS_CLIENT_ID and FAA_NMS_CLIENT_SECRET (the KEY and SECRET from the
# onboarding spreadsheet); without them it does nothing. Optional repository VARIABLES FAA_NMS_BASE and
# FAA_NMS_AUTH_URL point it at the staging host while testing (default: the production host).
# Nothing is fetched or published on schedule until the repository variable FAA_NMS_LIVE is set to "true", so a
# staging login can be tested ("probe") without its data reaching the live site. Switch to production = delete
# FAA_NMS_BASE and FAA_NMS_AUTH_URL, then set FAA_NMS_LIVE=true.
# Published into the `wx-data` branch next to the forecast and TFRs.
on:
  schedule:
    - cron: "23 */3 * * *" # every 3 hours; all but one a day end at once because the last file is under 23 hours old
  workflow_dispatch:
    inputs:
      probe:
        description: "Check the connection and print what comes back (no secrets) instead of publishing"
        type: boolean
        default: false
      force:
        description: "Bulk-pull even if the last one was under 23 hours ago (counts against the service's one-per-day limit)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-wx
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check the NMS connection
        if: ${{ inputs.probe }}
        env:
          FAA_NMS_CLIENT_ID: ${{ secrets.FAA_NMS_CLIENT_ID }}
          FAA_NMS_CLIENT_SECRET: ${{ secrets.FAA_NMS_CLIENT_SECRET }}
          FAA_NMS_BASE: ${{ vars.FAA_NMS_BASE }}
          FAA_NMS_AUTH_URL: ${{ vars.FAA_NMS_AUTH_URL }}
        run: node scripts/fetch-notams.js --probe

      - name: Get the last published NOTAM file
        if: ${{ !inputs.probe && vars.FAA_NMS_LIVE == 'true' }}
        run: |
          mkdir -p data/generated/wx
          if git fetch --depth=1 origin wx-data 2>/dev/null && git show FETCH_HEAD:wx/notams.json > data/generated/wx/notams.previous.json 2>/dev/null; then
            echo "previous file built at: $(node -e "console.log(JSON.parse(require('fs').readFileSync('data/generated/wx/notams.previous.json','utf8')).builtAt)")"
          else
            rm -f data/generated/wx/notams.previous.json
            echo "no previous NOTAM file"
          fi

      - name: Fetch NOTAMs
        if: ${{ !inputs.probe && vars.FAA_NMS_LIVE == 'true' }}
        env:
          FAA_NMS_CLIENT_ID: ${{ secrets.FAA_NMS_CLIENT_ID }}
          FAA_NMS_CLIENT_SECRET: ${{ secrets.FAA_NMS_CLIENT_SECRET }}
          FAA_NMS_BASE: ${{ vars.FAA_NMS_BASE }}
          FAA_NMS_AUTH_URL: ${{ vars.FAA_NMS_AUTH_URL }}
        run: node scripts/fetch-notams.js ${{ inputs.force && '--force' || '' }}

      - name: Publish to wx-data
        if: ${{ !inputs.probe && vars.FAA_NMS_LIVE == 'true' }}
        run: |
          set -e
          if [ ! -f data/generated/wx/notams.json ]; then echo "no NOTAM file (no credentials?), nothing to publish"; exit 0; fi
          tmp="$(mktemp -d)"
          cp data/generated/wx/notams.json "$tmp/notams.json"
          git config user.name "xc-gpt-bot"
          git config user.email "actions@users.noreply.github.com"
          # keep the forecast and TFR files that are already on wx-data, if any
          if git fetch --depth=1 origin wx-data; then
            git checkout --orphan wx-data-tmp FETCH_HEAD
          else
            git checkout --orphan wx-data-tmp
            git rm -rf -q .
            mkdir wx
          fi
          mkdir -p wx
          cp "$tmp/notams.json" wx/notams.json
          git add wx
          git commit -q -m "notam data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push --force origin HEAD:wx-data
