name: Refresh fields & airspace

# Mondays and Thursdays: FAA NASR airport facts + GSA per diem for every nav-list field,
# and the airspace layers (FAA SUA / MTR geometry merged with the curated
# AP/1A-AP/1B scheduling details). NASR changes every 28 days, always on a
# Thursday, so the Thursday run picks a new cycle up the day it takes effect;
# Monday catches anything else (GSA changes yearly). A finished run triggers
# deploy-pages.yml.
on:
  schedule:
    - cron: "17 7 * * 1" # Mondays 07:17 UTC
    - cron: "17 7 * * 4" # Thursdays 07:17 UTC (AIRAC cycles take effect on Thursdays)
  workflow_dispatch:
    inputs:
      probe:
        description: "Only print what the other NASR bundles hold about one airport (approach control); change nothing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Probe NASR bundles
        if: ${{ inputs.probe }}
        run: node scripts/probe-nasr.js

      - name: Field facts (NASR + per diem)
        if: ${{ !inputs.probe }}
        env:
          GSA_API_KEY: ${{ secrets.GSA_API_KEY }}
        run: node scripts/build-fields.js

      - name: Airspace layers
        if: ${{ !inputs.probe }}
        run: node scripts/fetch-airspace.js

      - name: Commit if changed
        if: ${{ !inputs.probe }}
        run: |
          git config user.name "xc-gpt-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/generated/field-facts.json data/generated/airspace-sua.json data/generated/airspace-mtr.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh field facts + airspace ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            pushed=0
            for i in 1 2 3; do
              if git pull --rebase origin "${GITHUB_REF_NAME}" && git push; then pushed=1; break; fi
              sleep $((i * 5))
            done
            [ "$pushed" = 1 ]
          fi
