name: Refresh fields & airspace

# Weekly: FAA NASR airport facts + GSA per diem for every nav-list field,
# and the airspace layers (FAA SUA / MTR geometry merged with the curated
# AP/1A-AP/1B scheduling details). NASR publishes every 28 days and GSA
# yearly, so weekly is plenty. A finished run triggers deploy-pages.yml.
on:
  schedule:
    - cron: "17 7 * * 1" # Mondays 07:17 UTC
  workflow_dispatch: {}
