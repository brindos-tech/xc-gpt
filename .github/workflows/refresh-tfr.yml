name: Refresh TFRs

# Temporary flight restrictions from the FAA (scripts/fetch-tfr.js).
# GitHub runs scheduled workflows on a best-effort basis: the schedule below was seen running only every 4 to 11
# hours. So the run is ALSO started every 15 minutes from outside, by a timer service calling GitHub's
# "run workflow" API with a fine-grained token that can only start workflows in this repository (see
# docs/OPERATIONS.md, "TFR timer"). The schedule stays as the fallback if that timer stops.
# The first step ends the run in seconds when the published file is under 10 minutes old, so extra starts cost
# nothing and add no commits.
# Published into the same `wx-data` branch as the forecast and NOTAMs (scripts/publish-wx-file.sh retries if one of
# them updated the branch meanwhile). The page reads tfr.json straight from that branch, so no deploy is needed.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-wx
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Is the published file already fresh?
        id: fresh
        run: |
          if git fetch --depth=1 origin wx-data 2>/dev/null; then
            built="$(git show FETCH_HEAD:wx/tfr.json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).builtAt||"")}catch{console.log("")}})')"
            if [ -n "$built" ]; then
              age=$(( $(date -u +%s) - $(date -u -d "$built" +%s) ))
              echo "published file built $built (${age}s ago)"
              if [ "$age" -lt 600 ]; then echo "fresh=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            fi
          fi
          echo "fresh=false" >> "$GITHUB_OUTPUT"

      - name: Fetch TFRs
        if: ${{ steps.fresh.outputs.fresh != 'true' }}
        run: node scripts/fetch-tfr.js

      - name: Publish to wx-data
        if: ${{ steps.fresh.outputs.fresh != 'true' }}
        run: scripts/publish-wx-file.sh data/generated/wx/tfr.json "tfr data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
