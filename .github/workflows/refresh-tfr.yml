name: Refresh TFRs

# Temporary flight restrictions from the FAA (scripts/fetch-tfr.js), kept fresh to within about 10 minutes.
# GitHub runs scheduled workflows on a best-effort basis: a "every 10 minutes" schedule was observed running only
# every 4 to 11 hours. So one run does not wait for the scheduler. It stays alive for about 50 minutes, refreshing
# every 10 minutes, and ends by starting the next run itself (a chain). The schedule below is only the safety net
# that restarts the chain if it ever breaks; while a run is going, the scheduled ones just wait their turn.
# Published into the same `wx-data` branch as the forecast (scripts/publish-wx-file.sh retries if another job
# updated the branch meanwhile). The page reads tfr.json straight from that branch, so no site deploy is needed.
# A new FAA feed that fails or comes back empty keeps the last good file (fetch-tfr.js refuses to publish nothing).
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to keep refreshing before starting the next run (0 = one refresh and stop, no chain)"
        type: string
        default: "50"

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-tfr
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Refresh every 10 minutes
        env:
          MINUTES: ${{ inputs.minutes || '50' }}
        run: |
          end=$(( $(date +%s) + MINUTES * 60 ))
          n=0
          while :; do
            n=$((n+1))
            echo "::group::refresh $n at $(date -u +%H:%M:%SZ)"
            if node scripts/fetch-tfr.js && scripts/publish-wx-file.sh data/generated/wx/tfr.json "tfr data $(date -u +%Y-%m-%dT%H:%M:%SZ)"; then :; else echo "::warning::refresh $n failed; the last published file stays"; fi
            echo "::endgroup::"
            # stop when the next refresh would run past the end
            [ $(( $(date +%s) + 600 )) -gt "$end" ] && break
            sleep 600
          done

      - name: Start the next run
        if: ${{ always() && (inputs.minutes || '50') != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run refresh-tfr.yml --ref "${{ github.event.repository.default_branch }}"
