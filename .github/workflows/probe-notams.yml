name: Probe NOTAM sources

# One-off, manual: checks which public FAA NOTAM pages answer from GitHub
# Actions and what their output looks like (scripts/probe-notams.js).
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/probe-notams.js
