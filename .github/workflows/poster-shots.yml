name: TEMPORARY poster screenshots
on:
  push:
    branches: [claude/cloud-session-setup-i08vkf]
    paths: [".github/workflows/poster-shots.yml", ".github/poster/**"]
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p shots && node .github/poster/shots.mjs
      - name: Commit the screenshots to this branch (the session cannot download artifacts)
        run: |
          mkdir -p .github/poster/shots && cp shots/* .github/poster/shots/
          git config user.name "xc-gpt-bot"; git config user.email "actions@users.noreply.github.com"
          git add .github/poster/shots && git commit -q -m "TEMPORARY: poster screenshots" && git push origin HEAD:${{ github.ref_name }}
