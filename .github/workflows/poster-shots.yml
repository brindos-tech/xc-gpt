name: TEMPORARY poster screenshots
on:
  push:
    branches: [claude/cloud-session-setup-i08vkf]
    paths: [".github/workflows/poster-shots.yml", ".github/poster/**"]
permissions:
  contents: read
jobs:
  shots:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p shots && node .github/poster/shots.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: shots
