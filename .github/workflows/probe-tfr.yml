name: Probe TFR feeds
# TEMPORARY — finds a usable TFR source and whether browsers may call it.
on:
  push:
    branches: [claude/cloud-session-setup-i08vkf]
    paths: [".github/workflows/probe-tfr.yml"]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Probe
        continue-on-error: true
        run: |
          probe() {
            echo "=== $1"
            curl -sS -m 30 -D /tmp/h -o /tmp/b -H "Origin: https://brindos-tech.github.io" "$1" || true
            grep -iE "^(HTTP|access-control|content-type|content-length)" /tmp/h || true
            head -c 700 /tmp/b; echo
          }
          probe "https://tfr.faa.gov/tfrapi/getTfrList"
          probe "https://tfr.faa.gov/geoserver/TFR/ows?service=WFS&version=1.1.0&request=GetFeature&typeName=TFR:V_TFR_LOC&maxFeatures=2&outputFormat=application/json&srsname=EPSG:4326"
          probe "https://services6.arcgis.com/ssFJjBXIUyZDrSYZ/arcgis/rest/services/Temporary_Flight_Restrictions/FeatureServer/0/query?where=1%3D1&outFields=*&f=geojson&resultRecordCount=2"
          curl -sS -m 30 "https://tfr.faa.gov/geoserver/TFR/ows?service=WFS&version=1.1.0&request=GetFeature&typeName=TFR:V_TFR_LOC&maxFeatures=4&outputFormat=application/json&srsname=EPSG:4326" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log("count",j.totalFeatures,j.features.length);for(const f of j.features){const g=f.geometry;console.log(f.id,g.type,JSON.stringify(f.properties).slice(0,900))}})'
          echo "=== total count"
          curl -sS -m 30 "https://tfr.faa.gov/geoserver/TFR/ows?service=WFS&version=1.1.0&request=GetFeature&typeName=TFR:V_TFR_LOC&resultType=hits" | head -c 400; echo
