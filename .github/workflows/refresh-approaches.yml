name: Refresh approaches

# Instrument approaches per nav-list field from the FAA d-TPP metadata
# (scripts/fetch-approaches.js). The data changes every 28 days, always on a
# Thursday, so it runs Thursdays (the day a new cycle takes effect) and
# Mondays (the file is d-TPP_Metafile.xml); the commit only happens when
# something changed. A finished run triggers deploy-pages.yml.
on:
  schedule:
    - cron: "29 8 * * 1" # Mondays 08:29 UTC
    - cron: "29 8 * * 4" # Thursdays 08:29 UTC (AIRAC cycles take effect on Thursdays)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build approaches
        run: node scripts/fetch-approaches.js

      - name: Commit if changed
        run: |
          git config user.name "xc-gpt-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/generated/approaches.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh approaches ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            pushed=0
            for i in 1 2 3; do
              if git pull --rebase origin "${GITHUB_REF_NAME}" && git push; then pushed=1; break; fi
              sleep $((i * 5))
            done
            [ "$pushed" = 1 ]
          fi
