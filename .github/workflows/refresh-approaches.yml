name: Refresh approaches

# Instrument approaches per nav-list field from the FAA d-TPP metadata
# (scripts/fetch-approaches.js). The data changes every 28 days, always on a
# Thursday. It is checked daily (GitHub drops some scheduled runs) and rebuilt
# only when a new cycle is in force or the file is 6+ days old
# (scripts/faa-data-current.js). A finished run triggers deploy-pages.yml.
on:
  schedule:
    - cron: "29 8 * * *" # daily 08:29 UTC; ends at once unless a new 28-day cycle is in force or the data is 6+ days old
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Already built from the current FAA cycle?
        id: current
        if: ${{ github.event_name == 'schedule' }}
        run: node scripts/faa-data-current.js data/generated/approaches.json | tee /dev/stderr | grep '^current=' >> "$GITHUB_OUTPUT"

      - name: Build approaches
        if: ${{ steps.current.outputs.current != 'true' }}
        run: node scripts/fetch-approaches.js

      - name: Commit if changed
        if: ${{ steps.current.outputs.current != 'true' }}
        run: |
          git config user.name "xc-gpt-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/generated/approaches.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh approaches ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            pushed=0
            for i in 1 2 3; do
              if git pull --rebase origin "${GITHUB_REF_NAME}" && git push; then pushed=1; break; fi
              sleep $((i * 5))
            done
            [ "$pushed" = 1 ]
          fi
