name: Refresh weekly

on:
  schedule:
    - cron: "0 7 * * 0" # Sundays, 07:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync Spotify top artists
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: node scripts/fetch-spotify.js

      - name: Resolve new artists' Ticketmaster attraction ids
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: node scripts/resolve-attractions.js

      - name: Rebuild generated data with any new artist matches
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: |
          node scripts/fetch-ticketmaster.js
          node scripts/expand-recurring.js
          node scripts/merge.js
          node scripts/validate.js

      - name: Check link health
        run: node scripts/check-links.js

      - name: Commit if changed
        run: |
          git config user.name "xc-gpt-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/curated/artists.json data/generated/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: weekly artist sync + link health ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
