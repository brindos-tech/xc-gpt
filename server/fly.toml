# Fly.io config for the XC GPT comments API. See server/README.md for setup.
app = "xc-gpt-comments"
primary_region = "dfw"

[build]
  dockerfile = "Dockerfile"

[env]
  ALLOWED_ORIGINS = "https://brindos-tech.github.io"

[mounts]
  source = "comments_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
