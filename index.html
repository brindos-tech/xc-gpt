<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XC GPT | Situational Awareness</title>
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<!-- crossorigin so the service worker gets a readable (cacheable) response, not an opaque one -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" crossorigin="anonymous" />
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/map.css">
</head>
<body>

<div class="app">

  <header class="app-header">
    <button class="rail-toggle-btn" id="railToggle" style="display:none;" aria-controls="filterRail" aria-expanded="false">☰ Filters</button>
    <h1>XC GPT <span class="accent">&#9992;</span></h1>
    <div class="header-search">
      <input type="text" id="globalSearch" placeholder="Search places, events, artists&hellip;" autocomplete="off">
    </div>
    <div class="freshness" id="freshnessReadout">
      <span class="source-dot ok" id="freshnessDot"></span>
      <span id="freshnessText">loading&hellip;</span>
    </div>
  </header>

  <div class="app-body">

    <div class="rail-backdrop" id="railBackdrop"></div>

    <aside class="filter-rail" id="filterRail">
      <!-- Mobile-only: the rail opens as a fixed sheet, and the header's
           toggle button scrolls out of reach with the rest of the page,
           so the sheet needs its own close control. Sticky, not absolute —
           the rail is the scrolling element (see .filter-rail overflow-y),
           and an absolute button would scroll away with the content. -->
      <div class="rail-mobile-header">
        <span>Filters</span>
        <button class="rail-close" id="railClose" aria-label="Close filters">&times;</button>
      </div>

      <div class="rail-section">
        <h3>Departure Base</h3>
        <div class="chip-row" id="originChips"></div>
      </div>

      <div class="rail-section">
        <h3>Range from <span id="rangeOriginLabel">KEND</span></h3>
        <div class="range-readout"><span id="rangeValue">600</span><small> nm</small></div>
        <div class="range-counts" id="rangeCounts">— places · — events</div>
        <div class="range-slider-track">
          <input type="range" id="rangeSlider" min="50" max="1200" step="10" value="600">
        </div>
        <div class="range-marks" id="rangeMarks"></div>
      </div>

      <div class="rail-section">
        <h3>Rules</h3>
        <div class="toggle-row">
          <div>
            <div class="toggle-label">West of the Mississippi only</div>
            <span class="toggle-delta" id="westDelta"></span>
          </div>
          <label class="switch">
            <input type="checkbox" id="westToggle">
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="rail-section">
        <h3>Category</h3>
        <div class="chip-row" id="categoryChips"></div>
      </div>

      <div class="rail-section">
        <h3>Activity</h3>
        <div class="chip-row" id="activityChips"></div>
      </div>

      <button class="rail-reset" id="railReset">Reset filters</button>
      <div class="rail-easter-egg">To the dragons!</div>
    </aside>

    <div class="main-area">
      <div class="view-surface" id="viewSurface">
        <div class="view-pane active" id="pane-map">
          <div id="mapWrap"></div>
          <div class="map-legend" id="mapLegend"></div>
          <div class="map-river-delta" id="riverDelta" style="display:none;"></div>
        </div>
        <div class="view-pane" id="pane-feed"><div class="view-inner" id="feedInner"></div></div>
        <div class="view-pane" id="pane-places"><div class="view-inner" id="placesInner"></div></div>
        <div class="view-pane" id="pane-artists"><div class="view-inner" id="artistsInner"></div></div>
        <div class="view-pane" id="pane-weekends"><div class="view-inner" id="weekendsInner"></div></div>

        <div class="detail-backdrop" id="detailBackdrop"></div>

        <div class="detail-panel" id="detailPanel" role="dialog" aria-label="Place details">
          <button class="dp-close" id="detailClose" aria-label="Close">&times;</button>
          <div id="detailContent"></div>
        </div>
      </div>

      <div class="scrubber-wrap" id="scrubberWrap"></div>
    </div>

  </div>

  <nav class="tab-bar" id="tabBar">
    <button class="active" data-view="map">Map</button>
    <button data-view="feed">Feed</button>
    <button data-view="places">Places</button>
    <button data-view="artists">Artists</button>
    <button data-view="weekends">Weekend Recs</button>
  </nav>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" crossorigin="anonymous"></script>
<script type="module" src="assets/js/main.js"></script>
</body>
</html>
